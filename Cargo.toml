[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
rusqlite = { version = "0.31", features = ["bundled"] }
zstd = "0.13"
protocol = { path = "crates/protocol" }
sandbox-policy = { path = "crates/sandbox-policy" }
approval = { path = "crates/approval" }
tools = { path = "crates/tools" }
session = { path = "crates/session" }
context = { path = "crates/context" }
agent-loop = { path = "crates/agent-loop" }
model-provider = { path = "crates/model-provider" }
sandbox-exec = { path = "crates/sandbox-exec" }
network-proxy = { path = "crates/network-proxy" }
