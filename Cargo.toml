[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
protocol = { path = "crates/protocol" }
sandbox-policy = { path = "crates/sandbox-policy" }
approval = { path = "crates/approval" }
tools = { path = "crates/tools" }
session = { path = "crates/session" }
context = { path = "crates/context" }
agent-loop = { path = "crates/agent-loop" }
