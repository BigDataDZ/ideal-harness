name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build（全部 feature）
        run: cargo build --workspace --all-targets --all-features

      # TASK-807：Landlock 集成测试在 Ubuntu 真实执行（无 Landlock 内核会硬失败，
      # 不允许静默跳过冒充通过）；Windows 受限 token 测试在 windows 矩阵执行。
      - name: Clippy（P1 起为合并硬门禁）
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test（全部 feature；Ubuntu 覆盖 Landlock 后端）
        run: cargo test --workspace --all-features

  msrv:
    # TASK-807：MSRV 门禁——workspace 声明的最低工具链必须可构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - name: Build（MSRV）
        run: cargo build --workspace

  supply-chain:
    # TASK-807：依赖漏洞 / 许可证 / 来源检查（cargo-deny，可复现配置见 deny.toml）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny check（advisories + licenses + sources + bans）
        run: cargo deny --workspace check advisories bans licenses sources


  desktop:
    # TASK-909：桌面端门禁——前端门禁 + Playwright E2E + Tauri NSIS 构建 + 产物（unsigned）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Frontend typecheck + unit tests + build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Desktop Rust gates（src-tauri）
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings
          cargo test
      - name: Install Playwright chromium
        working-directory: apps/desktop
        run: npx playwright install chromium
      - name: Playwright E2E（scripted provider）
        working-directory: apps/desktop
        run: npm run e2e
      - name: Tauri NSIS build（unsigned 内部测试包）
        working-directory: apps/desktop
        run: npm run tauri build
      - name: 生成校验和与 SBOM
        working-directory: apps/desktop
        run: node scripts/artifacts.mjs src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload unsigned installer + SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ideal-harness-desktop-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS
            apps/desktop/src-tauri/target/release/bundle/nsis/sbom.json
          if-no-files-found: error
