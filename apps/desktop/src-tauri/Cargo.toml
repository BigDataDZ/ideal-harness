[package]
name = "ideal-harness-desktop"
version = "0.9.0"
description = "Restricted Tauri desktop shell for ideal-harness"
authors = ["BigDataDZ <BigDataDZ@users.noreply.github.com>"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85.0"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
harness-host = { path = "../../../crates/harness-host" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[workspace]
